[project]
name = "scheduling-agent"
version = "0.1.0"
description = "Agentic appointment-scheduling app connecting OpenAI Realtime API to phone calls via Twilio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "sqlmodel>=0.0.21",
    "openai-agents>=0.9.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0",
    "twilio>=9.0.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.1",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "agents.*",
    "twilio.*",
    "googleapiclient.*",
    "google.*",
    "slowapi.*",
]
ignore_missing_imports = true

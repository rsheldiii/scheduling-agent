services:
  scheduling-agent:
    build: .
    ports:
      - "2255:2255"
    secrets:
      - api_bearer_token
      - openai_api_key
      - twilio_account_sid
      - twilio_auth_token
      - twilio_phone_from
      - user_info_secret
    volumes:
      - ./user_info.yaml.enc:/app/user_info.yaml.enc:ro
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET}
      - DOMAIN=${DOMAIN}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_CALENDAR_CREDENTIALS=/app/credentials.json
      - TWILIO_SIGNATURE_VALIDATION=${TWILIO_SIGNATURE_VALIDATION:-true}
      - PORT=2255
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

secrets:
  api_bearer_token:
    environment: API_BEARER_TOKEN
  openai_api_key:
    environment: OPENAI_API_KEY
  twilio_account_sid:
    environment: TWILIO_ACCOUNT_SID
  twilio_auth_token:
    environment: TWILIO_AUTH_TOKEN
  twilio_phone_from:
    environment: PHONE_NUMBER_FROM
  user_info_secret:
    environment: USER_INFO_SECRET
